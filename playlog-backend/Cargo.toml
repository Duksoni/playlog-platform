[workspace]
members = ["services/*", "shared/*"]
resolver = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace.dependencies]
# --- Async runtime & HTTP ---
tokio = { version = "1.52.3", features = ["full"] }
axum = { version = "0.8.9" }
axum-extra = { version = "0.12.6", features = ["cookie", "multipart", "query"] }
axum-macros = "0.5.1"
tower-http = { version = "0.6.11", features = ["timeout", "trace", "cors"] }
reqwest = { version = "0.13.4", features = ["json", "rustls", "stream"] }

# --- Serialization and validation ---
bson = { version = "3.1.0", features = ["chrono-0_4", "uuid-1"] }
bytes = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
validator = { version = "0.20.0", features = ["derive"] }
regex = "1.12.4"
once_cell = "1.21.4"

# --- Config ---
dotenvy = "0.15.7"

# --- Error handling ---
thiserror = "2.0.18"
anyhow = "1.0.102"

# --- Auth & security ---
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto", "use_pem"] }
argon2 = "0.5"
cookie = "0.18.1"

# --- Async ---
async-trait = "0.1.89"
futures = "0.3.32"

# --- Logging ---
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }

# --- Databases and Storage ---
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono",  "uuid"] }
mongodb = { version = "3.7.0", features = ["bson-3", "compat-3-0-0"] }
minio = { git = "https://github.com/minio/minio-rs.git", rev = "e73fa10", default-features = false, features = ["rustls-tls", "default-crypto"] }

# --- OpenAPI Documentation ---
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid", "preserve_order"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# --- Shared ---
jwt-common = { path = "shared/jwt-common" }
service-common = { path = "shared/service-common" }